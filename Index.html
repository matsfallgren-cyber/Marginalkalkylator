<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Marginal">
<title>Marginalkalkylator EUR → SEK</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f2f2f7}
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);background:#f2f2f7}
main{max-width:640px;margin:auto;padding:18px 0 30px}
h1{font-size:25px;margin:4px 2px 16px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
label{display:block;font-size:14px;font-weight:650;margin:0 0 6px}
input{width:100%;font-size:22px;padding:12px;border:1px solid #c7c7cc;border-radius:11px;background:white;margin-bottom:14px}
input:last-child{margin-bottom:0}
.small{font-size:13px;color:#666;margin-top:10px;line-height:1.35}
.summary{font-size:16px;line-height:1.5}
.summary strong{font-size:19px}
table{width:100%;border-collapse:collapse;background:white;border-radius:16px;overflow:hidden}
th,td{padding:11px 14px;border-bottom:1px solid #e5e5ea;font-variant-numeric:tabular-nums}
th{text-align:left;background:#fafafa;font-size:13px}
td:last-child,th:last-child{text-align:right}
tr:last-child td{border-bottom:0}
.empty{text-align:center!important;color:#777;padding:24px}
</style>
</head>
<body>
<main>
<h1>Marginalkalkylator</h1>
<div class="card">
  <label for="purchase">Inköpspris (€)</label>
  <input id="purchase" inputmode="decimal" autocomplete="off" placeholder="t.ex. 100,00">
  <label for="fx">Valutafaktor EUR → SEK</label>
  <input id="fx" inputmode="decimal" autocomplete="off" value="11,00">
  <div class="small">Valutafaktorn sparas på enheten. Inköpspriset sparas inte.</div>
</div>
<div class="card summary" id="summary">Mata in ett inköpspris i euro.</div>
<table>
<thead><tr><th>Marginal</th><th>Säljpris SEK exkl. moms</th></tr></thead>
<tbody id="rows"><tr><td colspan="2" class="empty">Mata in inköpspris ovan</td></tr></tbody>
</table>
</main>
<script>
const p=document.getElementById('purchase'), f=document.getElementById('fx'),
rows=document.getElementById('rows'), summary=document.getElementById('summary');
const saved=localStorage.getItem('eursek-factor'); if(saved) f.value=saved;
function num(v){return parseFloat(String(v).replace(/\s/g,'').replace(',','.'))}
function money(v){return new Intl.NumberFormat('sv-SE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v)}
function calc(){
 const eur=num(p.value), fx=num(f.value);
 if(Number.isFinite(fx)&&fx>0) localStorage.setItem('eursek-factor',f.value);
 if(!(eur>=0)||!(fx>0)){summary.textContent='Mata in ett giltigt inköpspris och en valutafaktor.';rows.innerHTML='<tr><td colspan="2" class="empty">Ingen beräkning ännu</td></tr>';return}
 const cost=eur*fx;
 summary.innerHTML='Inköpskostnad i SEK: <strong>'+money(cost)+' kr</strong>';
 let s='';
 for(let m=0;m<=40;m++){
   const sale=cost/(1-m/100);
   s+='<tr><td>'+m+' %</td><td>'+money(sale)+' kr</td></tr>';
 }
 rows.innerHTML=s;
}
p.addEventListener('input',calc); f.addEventListener('input',calc);
p.value=''; 
</script>
</body>
</html>
